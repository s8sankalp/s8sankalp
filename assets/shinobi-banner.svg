<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 160" width="100%" height="160">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bannerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#111726"/>
      <stop offset="100%" stop-color="#0a0e1a"/>
    </linearGradient>

    <!-- Rasengan Glow -->
    <radialGradient id="rasenganGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="30%" stop-color="#00f0ff"/>
      <stop offset="70%" stop-color="#0077b6"/>
      <stop offset="100%" stop-color="#001845" stop-opacity="0"/>
    </radialGradient>

    <!-- Chidori Glow -->
    <radialGradient id="chidoriGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="35%" stop-color="#c084fc"/>
      <stop offset="70%" stop-color="#7928ca"/>
      <stop offset="100%" stop-color="#3b0764" stop-opacity="0"/>
    </radialGradient>

    <!-- Clash Center Glow -->
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Banner Base -->
  <rect x="2" y="2" width="846" height="156" rx="12" fill="url(#bannerBg)" stroke="#30363d" stroke-width="1.5"/>

  <!-- Lo-Fi Drifting Sakura Petals Animation -->
  <!-- Petal 1 -->
  <path d="M 0,0 C 3,-4 8,-2 10,2 C 7,6 2,4 0,0 Z" fill="#ff70a6" opacity="0.6">
    <animateTransform attributeName="transform" type="translate" values="100,-20; 250,180" dur="7s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="5s" repeatCount="indefinite" additive="sum"/>
  </path>
  <!-- Petal 2 -->
  <path d="M 0,0 C 2,-3 6,-1 8,2 C 6,5 2,3 0,0 Z" fill="#ff70a6" opacity="0.4">
    <animateTransform attributeName="transform" type="translate" values="400,-20; 520,180" dur="9s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0; -360" dur="6s" repeatCount="indefinite" additive="sum"/>
  </path>
  <!-- Petal 3 -->
  <path d="M 0,0 C 3,-5 7,-3 9,1 C 7,5 1,3 0,0 Z" fill="#ff70a6" opacity="0.5">
    <animateTransform attributeName="transform" type="translate" values="700,-20; 790,180" dur="8s" repeatCount="indefinite"/>
    <animateTransform attributeName="transform" type="rotate" values="0; 360" dur="7s" repeatCount="indefinite" additive="sum"/>
  </path>

  <!-- Left: Naruto's Rasengan Energy Orb -->
  <g transform="translate(100, 80)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="42" fill="url(#rasenganGlow)" opacity="0.8">
      <animate attributeName="r" values="38;44;38" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Spinning Spiral 1 -->
    <circle cx="0" cy="0" r="26" fill="none" stroke="#ffffff" stroke-width="1.8" stroke-dasharray="14 10" opacity="0.9">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="1.2s" repeatCount="indefinite"/>
    </circle>
    <!-- Spinning Spiral 2 -->
    <circle cx="0" cy="0" r="16" fill="none" stroke="#90e0ef" stroke-width="2" stroke-dasharray="8 8" opacity="0.95">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="0.9s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#softGlow)"/>
  </g>

  <!-- Right: Sasuke's Chidori Lightning Orb -->
  <g transform="translate(750, 80)">
    <!-- Aura -->
    <circle cx="0" cy="0" r="42" fill="url(#chidoriGlow)" opacity="0.8">
      <animate attributeName="r" values="44;38;44" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <!-- Crackling Lightning Arcs -->
    <path d="M -12,-15 L -4,-2 L 8,-12 L 2,4 L 14,-2 L -2,16 L 2,2 Z" fill="none" stroke="#ffffff" stroke-width="2" filter="url(#softGlow)">
      <animate attributeName="opacity" values="0.4;1;0.2;0.9;0.4" dur="0.8s" repeatCount="indefinite"/>
    </path>
    <!-- Outer Electric Ring -->
    <circle cx="0" cy="0" r="24" fill="none" stroke="#c084fc" stroke-width="1.5" stroke-dasharray="6 14" opacity="0.8">
      <animateTransform attributeName="transform" type="rotate" from="0" to="-360" dur="1.5s" repeatCount="indefinite"/>
    </circle>
    <circle cx="0" cy="0" r="6" fill="#ffffff" filter="url(#softGlow)"/>
  </g>

  <!-- Center Typography -->
  <g transform="translate(425, 62)">
    <text x="0" y="0" text-anchor="middle" fill="#ffffff" font-family="'Fira Code', -apple-system, monospace" font-size="28" font-weight="800" letter-spacing="3" filter="url(#softGlow)">SANKALP SUMAN</text>
    <text x="0" y="30" text-anchor="middle" fill="#00b4d8" font-family="'Fira Code', -apple-system, monospace" font-size="14" font-weight="600" letter-spacing="1">⚡ BACKEND ENGINEER &bull; JAVA &amp; DISTRIBUTED SYSTEMS ⚡</text>
    <text x="0" y="52" text-anchor="middle" fill="#8b949e" font-family="'Fira Code', -apple-system, monospace" font-size="11">Rasengan x Chidori &bull; High Throughput Meets Bulletproof Resilience</text>
  </g>
</svg>
