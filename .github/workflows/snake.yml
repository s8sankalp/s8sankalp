name: Generate Naruto & Sasuke Snake Animation

on:
  schedule:
    - cron: "0 0 * * *"   # Run automatically every 24 hours
  workflow_dispatch:       # Allows manual trigger anytime from Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Generate Naruto (Light) & Sasuke (Dark) Contribution Snakes
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#ff5e00&color_dots=#ebedf0,#ffedd5,#fdba74,#fb923c,#ea580c
            dist/github-snake-dark.svg?color_snake=#a855f7&color_dots=#0d1117,#1c1936,#2e2050,#6b21a8,#00d2ff

      - name: Deploy SVGs to Output Branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
